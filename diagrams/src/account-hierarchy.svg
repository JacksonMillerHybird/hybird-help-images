<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1246" viewBox="0 0 1600 1246" font-family="Inter, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5634"/></marker>
<marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2602b"/></marker>
<marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf4a3c"/></marker>
<marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a4a"/></marker>
</defs>
<rect width="1600" height="1246" fill="#fcfbf7"/>
<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">How Hybird is organised</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">Every reading in Hybird OS sits somewhere in this structure.</text><rect x="230" y="200" width="1140" height="124" rx="20" fill="#eef0e6" stroke="#e3ded2" stroke-width="2"/><rect x="258" y="230" width="250" height="64" rx="32" fill="#4f5634" stroke="none" stroke-width="2"/><text x="383" y="273" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Account</text><text x="550" y="273" font-size="30" font-weight="400" fill="#2a2922" text-anchor="start">Your organisation in Hybird OS</text><line x1="383" y1="330" x2="383" y2="390" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="416" y="370" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start" font-style="italic">one or more sites</text><rect x="230" y="398" width="1140" height="124" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="258" y="428" width="250" height="64" rx="32" fill="#4f5634" stroke="none" stroke-width="2"/><text x="383" y="471" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Site</text><text x="550" y="471" font-size="30" font-weight="400" fill="#2a2922" text-anchor="start">A building or location</text><line x1="383" y1="528" x2="383" y2="588" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="416" y="568" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start" font-style="italic">one or more panels</text><rect x="230" y="596" width="1140" height="124" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="258" y="626" width="250" height="64" rx="32" fill="#4f5634" stroke="none" stroke-width="2"/><text x="383" y="669" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Panel</text><text x="550" y="669" font-size="30" font-weight="400" fill="#2a2922" text-anchor="start">An electrical board at the site</text><line x1="383" y1="726" x2="383" y2="786" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="416" y="766" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start" font-style="italic">connected through</text><rect x="230" y="794" width="1140" height="124" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="258" y="824" width="250" height="64" rx="32" fill="#4f5634" stroke="none" stroke-width="2"/><text x="383" y="867" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Controller</text><text x="550" y="867" font-size="30" font-weight="400" fill="#2a2922" text-anchor="start">Links the panel's breakers to Hybird</text><line x1="383" y1="924" x2="383" y2="984" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="416" y="964" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start" font-style="italic">a chain of breakers</text><rect x="230" y="992" width="1140" height="124" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="258" y="1022" width="250" height="64" rx="32" fill="#4f5634" stroke="none" stroke-width="2"/><text x="383" y="1065" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Breakers</text><text x="550" y="1065" font-size="30" font-weight="400" fill="#2a2922" text-anchor="start">Measure and protect each circuit</text><text x="800" y="1186" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="middle">Hybird OS and the Hybird API both follow this structure.</text>
</svg>