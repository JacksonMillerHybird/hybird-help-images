<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="864" viewBox="0 0 1600 864" font-family="Inter, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5634"/></marker>
<marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2602b"/></marker>
<marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf4a3c"/></marker>
<marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a4a"/></marker>
</defs>
<rect width="1600" height="864" fill="#fcfbf7"/>
<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">How your data reaches your system</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">Server to server, with no extra hardware in the panel.</text><rect x="64" y="250" width="280" height="330" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="204" y="316" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">Breakers</text><line x1="104" y1="346" x2="304" y2="346" stroke="#e3ded2" stroke-width="2"/><text x="204" y="396" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">Measure every</text>
<text x="204" y="434" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">circuit in the</text>
<text x="204" y="472" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">panel</text><rect x="461" y="250" width="280" height="330" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="601" y="316" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">Controller</text><line x1="501" y1="346" x2="701" y2="346" stroke="#e3ded2" stroke-width="2"/><text x="601" y="396" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">Sends readings</text>
<text x="601" y="434" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">over its own</text>
<text x="601" y="472" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">internet</text>
<text x="601" y="510" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">connection</text><rect x="858" y="250" width="280" height="330" rx="20" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="998" y="316" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">Hybird cloud</text><line x1="898" y1="346" x2="1098" y2="346" stroke="#e3ded2" stroke-width="2"/><text x="998" y="396" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">Stores data by</text>
<text x="998" y="434" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">account, site,</text>
<text x="998" y="472" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">panel and</text>
<text x="998" y="510" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">breaker</text><rect x="1255" y="250" width="280" height="330" rx="20" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="1395" y="316" font-size="32" font-weight="700" fill="#c2602b" text-anchor="middle">Your system</text><line x1="1295" y1="346" x2="1495" y2="346" stroke="#e3ded2" stroke-width="2"/><text x="1395" y="396" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">CTS or BMS,</text>
<text x="1395" y="434" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">ESG reporting,</text>
<text x="1395" y="472" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">data warehouse</text>
<text x="1395" y="510" font-size="26" font-weight="400" fill="#2a2922" text-anchor="middle">or your own app</text><line x1="354" y1="415" x2="447" y2="415" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="402.5" y="395" font-size="22" font-weight="600" fill="#6d6a5f" text-anchor="middle">RS485</text><line x1="751" y1="415" x2="844" y2="415" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="799.5" y="395" font-size="22" font-weight="600" fill="#6d6a5f" text-anchor="middle">Internet</text><line x1="1245" y1="365" x2="1152" y2="365" stroke="#c2602b" stroke-width="4" stroke-linecap="round" marker-end="url(#ahO)"/><text x="1196.5" y="313" font-size="22" font-weight="600" fill="#c2602b" text-anchor="middle">HTTPS</text><text x="1196.5" y="341" font-size="22" font-weight="600" fill="#c2602b" text-anchor="middle">+ token</text><line x1="1148" y1="465" x2="1241" y2="465" stroke="#4f5634" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="1196.5" y="505" font-size="22" font-weight="600" fill="#4f5634" text-anchor="middle">JSON</text><rect x="64" y="650" width="470" height="150" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="64" y="650" width="10" height="150" rx="5" fill="#3f7a4a"/><text x="100" y="702" font-size="28" font-weight="700" fill="#3f7a4a" text-anchor="start">No gateway</text><text x="100" y="742" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">No Modbus converter or extra</text>
<text x="100" y="774" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">boxes</text><rect x="565" y="650" width="470" height="150" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="565" y="650" width="10" height="150" rx="5" fill="#4f5634"/><text x="601" y="702" font-size="28" font-weight="700" fill="#4f5634" text-anchor="start">Read-only</text><text x="601" y="742" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">Switching stays in Hybird OS</text>
<text x="601" y="774" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">and the app</text><rect x="1066" y="650" width="470" height="150" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><rect x="1066" y="650" width="10" height="150" rx="5" fill="#4f5634"/><text x="1102" y="702" font-size="28" font-weight="700" fill="#4f5634" text-anchor="start">API docs</text><text x="1102" y="742" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">Add /api/v1/docs to your</text>
<text x="1102" y="774" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="start">account address, signed in</text>
</svg>