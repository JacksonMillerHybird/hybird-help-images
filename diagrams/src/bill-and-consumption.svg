<rect width="1600" height="1020" fill="#fcfbf7"/>
<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">From kWh to cost</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">How consumption in Hybird OS relates to your electricity bill.</text><rect x="64" y="210" width="400" height="190" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="264" y="298" font-size="38" font-weight="700" fill="#4f5634" text-anchor="middle">kWh used</text><text x="264" y="346" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">in each hour</text><rect x="600" y="210" width="400" height="190" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="800" y="298" font-size="38" font-weight="700" fill="#4f5634" text-anchor="middle">Spot price</text><text x="800" y="346" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">for that hour</text><rect x="1136" y="210" width="400" height="190" rx="20" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="1336" y="298" font-size="38" font-weight="700" fill="#4f5634" text-anchor="middle">Estimated cost</text><text x="1336" y="346" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">the market part of your bill</text><text x="532" y="327" font-size="64" font-weight="700" fill="#c2602b" text-anchor="middle">×</text><text x="1068" y="327" font-size="64" font-weight="700" fill="#c2602b" text-anchor="middle">=</text><text x="800" y="464" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="middle">The same kWh can cost very different amounts depending on the hour.</text><text x="64" y="550" font-size="32" font-weight="700" fill="#2a2922" text-anchor="start">What your electricity bill is made up of</text><rect x="64" y="586" width="344" height="160" rx="20" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="236" y="658" font-size="31" font-weight="700" fill="#2a2922" text-anchor="middle">Spot price</text><text x="236" y="700" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="middle">the market price</text><rect x="440" y="586" width="344" height="160" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="612" y="658" font-size="31" font-weight="700" fill="#2a2922" text-anchor="middle">Tariffs</text><text x="612" y="700" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="middle">for the grid</text><rect x="816" y="586" width="344" height="160" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="988" y="658" font-size="31" font-weight="700" fill="#2a2922" text-anchor="middle">Taxes</text><text x="988" y="700" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="middle">set by the state</text><rect x="1192" y="586" width="344" height="160" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><text x="1364" y="658" font-size="31" font-weight="700" fill="#2a2922" text-anchor="middle">Supplier's terms</text><text x="1364" y="700" font-size="24" font-weight="400" fill="#6d6a5f" text-anchor="middle">your electricity supplier</text><text x="236" y="786" font-size="22" font-weight="600" fill="#4f5634" text-anchor="middle">Shown in Hybird OS estimates</text><rect x="64" y="846" width="1472" height="110" rx="20" fill="#e7f0e8" stroke="#3f7a4a" stroke-width="2"/><circle cx="128" cy="901" r="26" fill="#3f7a4a"/><path d="M 116 902 l 9 9 l 17 -19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="912" font-size="30" font-weight="700" fill="#3f7a4a" text-anchor="start">Using fewer kWh lowers every per-kWh part of the bill.</text>
</svg>