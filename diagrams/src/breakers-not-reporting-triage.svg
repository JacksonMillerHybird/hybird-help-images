<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2a2922"/></marker><marker id="ah-olive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#4f5634"/></marker><marker id="ah-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c2602b"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#3f7a4a"/></marker><marker id="ah-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#cf4a3c"/></marker><marker id="ah-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6d6a5f"/></marker></defs><rect width="1600" height="1030" fill="#ffffff"/><rect x="450" y="50" width="700" height="110" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="800" y="114.6" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">Is the controller online?</text><path d="M1152,105 L1226,105" fill="none" stroke="#c2602b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-orange)"/><text x="1189" y="90" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#c2602b" text-anchor="middle">No</text><rect x="1230" y="40" width="320" height="130" rx="18" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="1390" y="94.1" font-family="Inter, sans-serif" font-size="27" font-weight="700" fill="#2a2922" text-anchor="middle">Network issue</text><text x="1390" y="132.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">See System offline</text><path d="M800,162 L800,236" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><text x="822" y="208" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="start">Yes</text><rect x="450" y="240" width="700" height="110" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="800" y="304.6" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">How many breakers are affected?</text><path d="M800,352 L800,410" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M236,410 L1364,410" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M236,410 L236,556" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="71" y="452" width="330" height="56" rx="12" fill="#fff"/><text x="236" y="490" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">One</text><rect x="60" y="560" width="352" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="236" y="632.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#2a2922" text-anchor="middle">Single breaker</text><text x="236" y="671.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">A/B reversed or a</text><text x="236" y="703.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">loose RS485 wire</text><text x="236" y="735.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">on that breaker</text><path d="M236,790 L236,840" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M612,410 L612,556" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="447" y="452" width="330" height="56" rx="12" fill="#fff"/><text x="612" y="490" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">All of them</text><rect x="436" y="560" width="352" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="612" y="632.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#2a2922" text-anchor="middle">Controller end</text><text x="612" y="671.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">A/B reversed at the</text><text x="612" y="703.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">controller, or plug</text><text x="612" y="735.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">not seated</text><path d="M612,790 L612,840" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M988,410 L988,556" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="823" y="452" width="330" height="56" rx="12" fill="#fff"/><text x="988" y="490" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">A physical cluster</text><rect x="812" y="560" width="352" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="988" y="648.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#2a2922" text-anchor="middle">Daisy-chain break</text><text x="988" y="687.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">After the last</text><text x="988" y="719.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">reporting device</text><path d="M988,790 L988,840" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1364,410 L1364,556" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="1199" y="434" width="330" height="92" rx="12" fill="#fff"/><text x="1364" y="470" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">One unreliable,</text><text x="1364" y="502" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">neighbour missing</text><rect x="1188" y="560" width="352" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="1364" y="648.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#2a2922" text-anchor="middle">Address collision</text><text x="1364" y="687.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Two devices share</text><text x="1364" y="719.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">an address</text><path d="M1364,790 L1364,840" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M236,840 L1364,840" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M800,840 L800,876" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="400" y="880" width="800" height="100" rx="18" fill="#4f5634" stroke="#4f5634" stroke-width="2"/><text x="800" y="938.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Contact Hybird support with your answers</text></svg>