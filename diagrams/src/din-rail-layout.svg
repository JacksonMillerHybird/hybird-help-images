er, sans-serif" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Edge</text><text x="777" y="511.1" font-family="Inter, sans-serif" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Controller</text><rect x="948" y="390" width="400" height="190" rx="12" fill="#fff" stroke="#b9b5aa" stroke-width="2.5" stroke-dasharray="10 8"/><text x="1148" y="492.5" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#6d6a5f" text-anchor="middle">Breakers</text><rect x="60" y="680" width="720" height="120" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="420" y="728.8" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4f5634" text-anchor="middle">Controller is always the rightmost</text><text x="420" y="767.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">of the PSU, UPS and controller</text><rect x="820" y="680" width="720" height="120" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="1180" y="728.8" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4f5634" text-anchor="middle">UPS always sits in the middle</text><text x="1180" y="767.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">between the PSU and the controller</text><text x="60" y="850" font-family="Inter, sans-serif" font-size="23" font-weight="400" fill="#6d6a5f" text-anchor="start">Not to scale.</text></svg>