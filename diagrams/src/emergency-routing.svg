<rect width="1600" height="1160" fill="#fcfbf7"/>
<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">Emergency or standard support?</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">Decide in seconds. Safety first.</text><rect x="200" y="196" width="1200" height="300" rx="20" fill="#ffffff" stroke="#2a2922" stroke-width="3"/><text x="800" y="258" font-size="34" font-weight="700" fill="#2a2922" text-anchor="middle">Is any of these happening?</text><circle cx="290" cy="318" r="9" fill="#cf4a3c"/><text x="320" y="327" font-size="28" font-weight="400" fill="#2a2922" text-anchor="start">Smoke, burning smell, sparks or visible damage</text><circle cx="290" cy="376" r="9" fill="#cf4a3c"/><text x="320" y="385" font-size="28" font-weight="400" fill="#2a2922" text-anchor="start">Someone has had an electric shock</text><circle cx="290" cy="434" r="9" fill="#cf4a3c"/><text x="320" y="443" font-size="28" font-weight="400" fill="#2a2922" text-anchor="start">Total system failure at a critical site</text><path d="M 680 500 L 394 584" fill="none" stroke="#cf4a3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahR)"/><path d="M 920 500 L 1206 584" fill="none" stroke="#3f7a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahG)"/><rect x="477" y="524" width="120" height="44" rx="22" fill="#cf4a3c" stroke="none" stroke-width="2"/><text x="537" y="554" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Yes</text><rect x="1003" y="524" width="120" height="44" rx="22" fill="#3f7a4a" stroke="none" stroke-width="2"/><text x="1063" y="554" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">No</text><rect x="64" y="596" width="660" height="92" rx="20" fill="#cf4a3c" stroke="none" stroke-width="2"/><text x="394" y="655" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Emergency</text><rect x="64" y="720" width="660" height="130" rx="20" fill="#f9e6e3" stroke="#cf4a3c" stroke-width="2"/><circle cx="128" cy="785" r="28" fill="#cf4a3c"/><text x="128" y="795" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="184" y="776" font-size="32" font-weight="700" fill="#2a2922" text-anchor="start">Disconnect power</text><text x="184" y="816" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">to the affected equipment</text><line x1="128" y1="852" x2="128" y2="880" stroke="#cf4a3c" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="64" y="884" width="660" height="130" rx="20" fill="#f9e6e3" stroke="#cf4a3c" stroke-width="2"/><circle cx="128" cy="949" r="28" fill="#cf4a3c"/><text x="128" y="959" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="184" y="940" font-size="32" font-weight="700" fill="#2a2922" text-anchor="start">Call +45 3020 4900</text><text x="184" y="980" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">and choose urgent support</text><rect x="876" y="596" width="660" height="92" rx="20" fill="#3f7a4a" stroke="none" stroke-width="2"/><text x="1206" y="655" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Standard support</text><rect x="876" y="720" width="660" height="100" rx="20" fill="#e7f0e8" stroke="#3f7a4a" stroke-width="2"/><text x="916" y="765" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Chat with Maggie</text><text x="916" y="801" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Self-serve help, any time</text><rect x="876" y="838" width="660" height="100" rx="20" fill="#e7f0e8" stroke="#3f7a4a" stroke-width="2"/><text x="916" y="883" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">support@hybird.energy</text><text x="916" y="919" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Troubleshooting, RMA, billing</text><rect x="876" y="956" width="660" height="100" rx="20" fill="#e7f0e8" stroke="#3f7a4a" stroke-width="2"/><text x="916" y="1001" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">+45 3020 4900</text><text x="916" y="1037" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Talk to the Hybird team</text><text x="800" y="1104" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">Maggie never troubleshoots a safety concern. She hands it to a person straight away.</text>
</svg>