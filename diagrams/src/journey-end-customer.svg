<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" font-family="Inter, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5634"/></marker>
<marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2602b"/></marker>
<marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf4a3c"/></marker>
<marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a4a"/></marker>
</defs>
<rect width="1600" height="1800" fill="#fcfbf7"/>
<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">Your journey with Hybird</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">The same steps whether you start with an installer or with Hybird.</text><rect x="64" y="196" width="640" height="150" rx="20" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="100" y="254" font-size="32" font-weight="700" fill="#c2602b" text-anchor="start">Through an installer</text><text x="100" y="298" font-size="26" font-weight="400" fill="#2a2922" text-anchor="start">Your installer or energy partner</text>
<text x="100" y="332" font-size="26" font-weight="400" fill="#2a2922" text-anchor="start">introduces Hybird</text><rect x="896" y="196" width="640" height="150" rx="20" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="932" y="254" font-size="32" font-weight="700" fill="#c2602b" text-anchor="start">Directly with Hybird</text><text x="932" y="298" font-size="26" font-weight="400" fill="#2a2922" text-anchor="start">You talk to the Hybird team</text>
<text x="932" y="332" font-size="26" font-weight="400" fill="#2a2922" text-anchor="start">yourself</text><path d="M 384 350 C 384 406, 760 376, 760 426" fill="none" stroke="#c2602b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><path d="M 1216 350 C 1216 406, 840 376, 840 426" fill="none" stroke="#c2602b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><rect x="160" y="436" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="492" r="28" fill="#4f5634"/><text x="220" y="502" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="276" y="484" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Site qualification</text><text x="276" y="524" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Consumption profile, flexible loads, after-hours use</text><line x1="220" y1="548" x2="220" y2="578" stroke="#4f5634" stroke-width="4"/><rect x="160" y="578" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="634" r="28" fill="#4f5634"/><text x="220" y="644" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="276" y="626" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Proposal and agreement</text><text x="276" y="666" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Scope agreed with your installer or Hybird</text><line x1="220" y1="690" x2="220" y2="720" stroke="#4f5634" stroke-width="4"/><rect x="160" y="720" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="776" r="28" fill="#4f5634"/><text x="220" y="786" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="276" y="768" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Panel build</text><text x="276" y="808" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Breakers, controller, PSU and optional UPS</text><line x1="220" y1="832" x2="220" y2="862" stroke="#4f5634" stroke-width="4"/><rect x="160" y="862" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="918" r="28" fill="#4f5634"/><text x="220" y="928" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="276" y="910" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Installation</text><text x="276" y="950" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Fitted on site by a certified electrician</text><line x1="220" y1="974" x2="220" y2="1004" stroke="#4f5634" stroke-width="4"/><rect x="160" y="1004" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="1060" r="28" fill="#4f5634"/><text x="220" y="1070" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="276" y="1052" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Commissioning in the app</text><text x="276" y="1092" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Each breaker addressed, tested and labelled</text><line x1="220" y1="1116" x2="220" y2="1146" stroke="#4f5634" stroke-width="4"/><rect x="160" y="1146" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="1202" r="28" fill="#4f5634"/><text x="220" y="1212" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="276" y="1194" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Eloverblik consent</text><text x="276" y="1234" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Read-only access to your meter data, with MitID</text><line x1="220" y1="1258" x2="220" y2="1288" stroke="#4f5634" stroke-width="4"/><rect x="160" y="1288" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="1344" r="28" fill="#4f5634"/><text x="220" y="1354" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="276" y="1336" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Monitoring</text><text x="276" y="1376" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Live data in Hybird OS and the app; SMS or email alarms</text><line x1="220" y1="1400" x2="220" y2="1430" stroke="#4f5634" stroke-width="4"/><rect x="160" y="1430" width="1280" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="220" cy="1486" r="28" fill="#4f5634"/><text x="220" y="1496" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="276" y="1478" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Recommendations</text><text x="276" y="1518" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Hybird points out where consumption can be cut</text><line x1="220" y1="1542" x2="220" y2="1572" stroke="#4f5634" stroke-width="4"/><rect x="160" y="1572" width="1280" height="112" rx="20" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><circle cx="220" cy="1628" r="28" fill="#3f7a4a"/><text x="220" y="1638" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="276" y="1620" font-size="30" font-weight="700" fill="#4f5634" text-anchor="start">Optimise with care</text><text x="276" y="1660" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Breaker sets on scheduled actions, critical operations untouched</text><text x="800" y="1744" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">Optimising is done with you, step by step, so critical operations keep running.</text>
</svg>