<text x="64" y="100" font-size="44" font-weight="700" fill="#2a2922" text-anchor="start">Becoming a Hybird installer</text>
<text x="64" y="148" font-size="26" font-weight="400" fill="#6d6a5f" text-anchor="start">From registration to your first panel.</text><rect x="120" y="200" width="1360" height="112" rx="20" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><circle cx="180" cy="256" r="28" fill="#c2602b"/><text x="180" y="266" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="236" y="248" font-size="30" font-weight="700" fill="#c2602b" text-anchor="start">Register on the webshop</text><text x="236" y="288" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">shop.hybird.energy · the Join the Hybird Ecosystem form</text><line x1="180" y1="312" x2="180" y2="342" stroke="#4f5634" stroke-width="4"/><rect x="120" y="342" width="1360" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="180" cy="398" r="28" fill="#4f5634"/><text x="180" y="408" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="236" y="390" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Hybird reviews your application</text><text x="236" y="430" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">CVR number and electrical certification are checked</text><line x1="180" y1="454" x2="180" y2="484" stroke="#4f5634" stroke-width="4"/><rect x="120" y="484" width="1360" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="180" cy="540" r="28" fill="#4f5634"/><text x="180" y="550" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="236" y="532" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Invitation email</text><text x="236" y="572" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Activate your webshop account; check spam if it is missing</text><line x1="180" y1="596" x2="180" y2="626" stroke="#4f5634" stroke-width="4"/><rect x="120" y="626" width="1360" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="180" cy="682" r="28" fill="#4f5634"/><text x="180" y="692" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="236" y="674" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Welcome call</text><text x="236" y="714" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">The Hybird team helps you find your way around</text><line x1="180" y1="738" x2="180" y2="768" stroke="#4f5634" stroke-width="4"/><rect x="120" y="768" width="1360" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="180" cy="824" r="28" fill="#4f5634"/><text x="180" y="834" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="236" y="816" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">Account manager and training</text><text x="236" y="856" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Your primary contact, onboarding materials and videos</text><line x1="180" y1="880" x2="180" y2="910" stroke="#4f5634" stroke-width="4"/><rect x="120" y="910" width="1360" height="112" rx="20" fill="#ffffff" stroke="#e3ded2" stroke-width="2"/><circle cx="180" cy="966" r="28" fill="#4f5634"/><text x="180" y="976" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="236" y="958" font-size="30" font-weight="700" fill="#2a2922" text-anchor="start">First order</text><text x="236" y="998" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Order on the webshop; orders dispatch within 24 hours</text><line x1="180" y1="1022" x2="180" y2="1052" stroke="#4f5634" stroke-width="4"/><rect x="120" y="1052" width="1360" height="112" rx="20" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><circle cx="180" cy="1108" r="28" fill="#3f7a4a"/><text x="180" y="1118" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="236" y="1100" font-size="30" font-weight="700" fill="#4f5634" text-anchor="start">First panel</text><text x="236" y="1140" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="start">Install, commission in the app, hand over to the customer</text><rect x="120" y="1214" width="1360" height="100" rx="20" fill="#ffffff" stroke="#4f5634" stroke-width="2" stroke-dasharray="10 8"/><text x="160" y="1261" font-size="27" font-weight="700" fill="#2a2922" text-anchor="start">Want to work with Hybird as a partner instead?</text><text x="160" y="1296" font-size="25" font-weight="600" fill="#4f5634" text-anchor="start">Email sales@hybird.energy</text>
