nter, sans-serif" font-size="25" font-weight="400" fill="#6d6a5f" text-anchor="middle">Possible at any stage before Operating</text><rect x="1185" y="430" width="335" height="200" rx="18" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="1352.5" y="485.9" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#c2602b" text-anchor="middle">Permanently locked</text><text x="1352.5" y="525.5" font-family="Inter, sans-serif" font-size="25" font-weight="400" fill="#2a2922" text-anchor="middle">to its account and site.</text><text x="1352.5" y="558.5" font-family="Inter, sans-serif" font-size="25" font-weight="400" fill="#2a2922" text-anchor="middle">Only Hybird admins</text><text x="1352.5" y="591.5" font-family="Inter, sans-serif" font-size="25" font-weight="400" fill="#2a2922" text-anchor="middle">can change it.</text><path d="M1352.5,380 L1352.5,430" fill="none" stroke="#c2602b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/></svg>