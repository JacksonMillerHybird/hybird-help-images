<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2a2922"/></marker><marker id="ah-olive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#4f5634"/></marker><marker id="ah-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c2602b"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#3f7a4a"/></marker><marker id="ah-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#cf4a3c"/></marker><marker id="ah-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6d6a5f"/></marker></defs><rect width="1600" height="800" fill="#ffffff"/><rect x="60" y="40" width="470" height="720" rx="18" fill="#fcfbf7" stroke="#e3ded2" stroke-width="2"/><text x="295" y="100" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#4f5634" text-anchor="middle">RCBOs throughout</text><path d="M90,150 L500,150" fill="none" stroke="#2a2922" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="295" y="600" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Each circuit has its</text><text x="295" y="634" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">own leakage protection</text><text x="295" y="668" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">A fault trips one circuit</text><rect x="565" y="40" width="470" height="720" rx="18" fill="#fcfbf7" stroke="#e3ded2" stroke-width="2"/><text x="800" y="100" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#4f5634" text-anchor="middle">RCD over MCBs</text><path d="M595,150 L1005,150" fill="none" stroke="#2a2922" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="800" y="600" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">One RCD protects</text><text x="800" y="634" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">a group of MCBs</text><text x="800" y="668" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Leakage trips the group</text><rect x="1070" y="40" width="470" height="720" rx="18" fill="#fcfbf7" stroke="#e3ded2" stroke-width="2"/><text x="1305" y="100" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#4f5634" text-anchor="middle">Mixed</text><path d="M1100,150 L1510,150" fill="none" stroke="#2a2922" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="1305" y="600" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">RCBOs where circuits</text><text x="1305" y="634" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">need their own</text><text x="1305" y="668" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">protection, groups elsewhere</text><path d="M145,150 L145,200" fill="none" stroke="#2a2922" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="145" cy="150" r=