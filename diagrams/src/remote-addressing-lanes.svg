ll="#2a2922" text-anchor="start">via the controller</text><path d="M420,892 L420,902 L1190,900 L1190,926" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="60" y="1088" width="720" height="118" rx="18" fill="#fff" stroke="#4f5634" stroke-width="2.5"/><circle cx="110" cy="1147" r="24" fill="#4f5634"/><text x="110" y="1155.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="156" y="1158" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">Confirm all the LEDs flashed</text><path d="M1190,1050 L1190,1060 L420,1058 L420,1084" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="840" y="1246" width="700" height="118" rx="18" fill="#fff" stroke="#c2602b" stroke-width="2.5"/><circle cx="890" cy="1305" r="24" fill="#c2602b"/><text x="890" y="1313.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="936" y="1296" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">Confirms the address</text><text x="936" y="1334" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">on the phone</text><path d="M420,1208 L420,1218 L1190,1216 L1190,1242" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="60" y="1404" width="720" height="118" rx="18" fill="#fff" stroke="#4f5634" stroke-width="2.5"/><circle cx="110" cy="1463" r="24" fill="#4f5634"/><text x="110" y="1471.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="156" y="1454" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">Flip the dip switch UP to Work</text><text x="156" y="1492" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">LED settles to one colour</text><path d="M1190,1366 L1190,1376 L420,1374 L420,1400" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="60" y="1562" width="1480" height="118" rx="18" fill="#4f5634" stroke="#4f5634" stroke-width="2.5"/><circle cx="110" cy="1621" r="24" fill="#fff"/><text x="110" y="1629.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="110" y="1630" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4f5634" text-anchor="middle">10</text><text x="156" y="1632" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Check together: the breaker reports measurements</text><path d="M420,1524 L420,1534 L800,1532 L800,1558" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><text x="800" y="1762" font-family="Inter, sans-serif" font-size="25" font-weight="600" fill="#2a2922" text-anchor="middle">Panel stays energised. Only one breaker in Setup mode at a time.</text></svg>