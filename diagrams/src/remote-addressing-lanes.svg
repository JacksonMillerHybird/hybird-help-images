<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2a2922"/></marker><marker id="ah-olive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#4f5634"/></marker><marker id="ah-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c2602b"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#3f7a4a"/></marker><marker id="ah-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#cf4a3c"/></marker><marker id="ah-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6d6a5f"/></marker></defs><rect width="1600" height="1800" fill="#ffffff"/><rect x="40" y="40" width="760" height="1670" rx="24" fill="#eef0e6" stroke="#eef0e6" stroke-width="2"/><rect x="820" y="40" width="740" height="1670" rx="24" fill="#f8ebe2" stroke="#f8ebe2" stroke-width="2"/><text x="420" y="100" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#4f5634" text-anchor="middle">On site</text><text x="1190" y="100" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#c2602b" text-anchor="middle">Hybird support</text><rect x="840" y="140" width="700" height="118" rx="18" fill="#fff" stroke="#c2602b" stroke-width="2.5"/><circle cx="890" cy="199" r="24" fill="#c2602b"/><text x="890" y="207.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="936" y="190" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">Prepares the new device</text><text x="936" y="228" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">on the panel in advance</text><rect x="60" y="298" width="1480" height="118" rx="18" fill="#4f5634" stroke="#4f5634" stroke-width="2.5"/><circle cx="110" cy="357" r="24" fill="#fff"/><text x="110" y="365.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="110" y="366" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4f5634" text-anchor="middle">2</text><text x="156" y="368" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Agree a time · you stay on the phone together</text><path d="M1190,260 L1190,270 L800,268 L800,294" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="60" y="456" width="720" height="118" rx="18" fill="#fff" stroke="#4f5634" stroke-width="2.5"/><circle cx="110" cy="515" r="24" fill="#4f5634"/><text x="110" y="523.64" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="156" y="506" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">Call Hybird support</text><text x="156" y="544" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#2a2922" text-anchor="start">before flipping anything</text><path d="M800,418 L800,428 L420,426 L420,452" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="60" y="614" 