<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2a2922"/></marker><marker id="ah-olive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#4f5634"/></marker><marker id="ah-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c2602b"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#3f7a4a"/></marker><marker id="ah-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#cf4a3c"/></marker><marker id="ah-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6d6a5f"/></marker></defs><rect width="1600" height="1110" fill="#ffffff"/><rect x="560" y="40" width="480" height="100" rx="18" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="800" y="99" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#2a2922" text-anchor="middle">A breaker keeps tripping</text><path d="M800,142 L800,196" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="480" y="200" width="640" height="100" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="800" y="259" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#4f5634" text-anchor="middle">One breaker or several?</text><path d="M1122,250 L1226,250" fill="none" stroke="#6d6a5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><text x="1172" y="234" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="#6d6a5f" text-anchor="middle">Several</text><rect x="1230" y="190" width="320" height="120" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="1390" y="241.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Check the supply and</text><text x="1390" y="273.2" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">upstream protection first</text><path d="M800,302 L800,366" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><text x="822" y="342" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="start">One</text><rect x="450" y="370" width="700" height="100" rx="18" fill="#eef0e6" stroke="#4f5634" stroke-width="2"/><text x="800" y="429" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#4f5634" text-anchor="middle">Check its readings in Hybird OS</text><path d="M800,472 L800,520" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M290,520 L1310,520" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M290,520 L290,636" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="100" y="548" width="380" height="52" rx="12" fill="#fff"/><text x="290" y="584" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">Leakage reading high</text><rect x="60" y="640" width="460" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="290" y="712.7" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Leakage trip</text><text x="290" y="751.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Disconnect loads one</text><text x="290" y="783.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">at a time; watch</text><text x="290" y="815.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">the leakage reading</text><path d="M290,870 L290,920" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M800,520 L800,636" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="610" y="548" width="380" height="52" rx="12" fill="#fff"/><text x="800" y="584" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">Current near the rating</text><rect x="570" y="640" width="460" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="800" y="712.7" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Overcurrent trip</text><text x="800" y="751.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Reduce the load, or</text><text x="800" y="783.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">uprate if the wiring</text><text x="800" y="815.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">allows it</text><path d="M800,870 L800,920" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1310,520 L1310,636" fill="none" stroke="#4f5634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-olive)"/><rect x="1120" y="548" width="380" height="52" rx="12" fill="#fff"/><text x="1310" y="584" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4f5634" text-anchor="middle">Both look normal</text><rect x="1080" y="640" width="460" height="230" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><text x="1310" y="712.7" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Intermittent fault</text><text x="1310" y="751.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Look for moisture,</text><text x="1310" y="783.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">damaged insulation or</text><text x="1310" y="815.7" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">faulty equipment</text><path d="M1310,870 L1310,920" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M290,920 L1310,920" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M800,920 L800,956" fill="none" stroke="#6d6a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="450" y="960" width="700" height="100" rx="18" fill="#4f5634" stroke="#4f5634" stroke-width="2"/><text x="800" y="1018.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Still tripping? Contact Hybird support</text></svg>