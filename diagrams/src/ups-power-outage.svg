<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2a2922"/></marker><marker id="ah-olive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#4f5634"/></marker><marker id="ah-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c2602b"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#3f7a4a"/></marker><marker id="ah-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#cf4a3c"/></marker><marker id="ah-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6d6a5f"/></marker></defs><rect width="1600" height="670" fill="#ffffff"/><rect x="60" y="130" width="270" height="330" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><path d="M60,148 a18,18 0 0 1 18,-18 h234 a18,18 0 0 1 18,18 v44 h-270 z" fill="#3f7a4a"/><text x="195" y="172" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Mains on</text><text x="195" y="250" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Normal</text><text x="195" y="310" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Breakers and</text><text x="195" y="344" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">controller report</text><path d="M333,295 L357,295" fill="none" stroke="#6d6a5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="362" y="130" width="270" height="330" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><path d="M362,148 a18,18 0 0 1 18,-18 h234 a18,18 0 0 1 18,18 v44 h-270 z" fill="#c2602b"/><text x="497" y="172" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">On UPS</text><text x="497" y="250" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Mains lost</text><text x="497" y="310" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Breakers lose power</text><text x="497" y="344" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Controller runs</text><text x="497" y="378" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">on the UPS</text><path d="M635,295 L659,295" fill="none" stroke="#6d6a5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="664" y="130" width="270" height="330" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><path d="M664,148 a18,18 0 0 1 18,-18 h234 a18,18 0 0 1 18,18 v44 h-270 z" fill="#c2602b"/><text x="799" y="172" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">On UPS</text><text x="799" y="250" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Up to ~4 hours</text><text x="799" y="310" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Controller online,</text><text x="799" y="344" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">sends alerts</text><text x="799" y="378" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">No readings stored</text><path d="M937,295 L961,295" fill="none" stroke="#6d6a5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="966" y="130" width="270" height="330" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><path d="M966,148 a18,18 0 0 1 18,-18 h234 a18,18 0 0 1 18,18 v44 h-270 z" fill="#cf4a3c"/><text x="1101" y="172" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Offline</text><text x="1101" y="250" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">UPS empty</text><text x="1101" y="310" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Controller goes</text><text x="1101" y="344" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">offline too</text><path d="M1239,295 L1263,295" fill="none" stroke="#6d6a5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="1268" y="130" width="270" height="330" rx="18" fill="#fff" stroke="#e3ded2" stroke-width="2"/><path d="M1268,148 a18,18 0 0 1 18,-18 h234 a18,18 0 0 1 18,18 v44 h-270 z" fill="#3f7a4a"/><text x="1403" y="172" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Mains on</text><text x="1403" y="250" font-family="Inter, sans-serif" font-size="29" font-weight="700" fill="#2a2922" text-anchor="middle">Mains back</text><text x="1403" y="310" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">Breakers and</text><text x="1403" y="344" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#2a2922" text-anchor="middle">controller resume</text><text x="60" y="90" font-family="Inter, sans-serif" font-size="27" font-weight="600" fill="#2a2922" text-anchor="start">The UPS powers the controller only. Breakers follow mains.</text><rect x="60" y="510" width="1478" height="110" rx="18" fill="#f8ebe2" stroke="#c2602b" stroke-width="2"/><text x="799" y="573.1" font-family="Inter, sans-serif" font-size="27" font-weight="700" fill="#2a2922" text-anchor="middle">Readings from the outage are not stored or uploaded later</text></svg>